version: 2

sources:
  - name: raw
    description: "Landing zone written by the validated Python ingestion step."
    schema: raw
    tables:
      - name: netflix_raw
        description: "Raw Netflix catalogue, one row per source record (pre-dedup)."
        columns:
          - name: show_id
            description: "Source identifier for a title."
            data_tests:
              - not_null

models:
  - name: stg_netflix
    description: >
      Cleaned, de-duplicated Netflix titles. One row per (title, type).
      Fixes the duration/rating column swap, casts date_added to a date, and
      splits the overloaded `duration` string into duration_minutes (movies)
      and num_seasons (TV shows).
    columns:
      - name: show_id
        description: "Primary key after de-duplication."
        data_tests:
          - not_null
          - unique
      - name: type
        description: "Movie or TV Show."
        data_tests:
          - not_null
          - accepted_values:
              values: ["Movie", "TV Show"]
      - name: title
        data_tests:
          - not_null
      - name: date_added
        description: "Date the title was added to Netflix (cast to date)."
      - name: duration_minutes
        description: "Runtime in minutes for movies; null for TV shows."
      - name: num_seasons
        description: "Season count for TV shows; null for movies."
